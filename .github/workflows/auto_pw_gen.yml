name: Generate and Update Daily Password

on:
  schedule:
    # 💡 KST 월~금 아침 7시는 UTC 기준 일~목 밤 22시 (0 22 * * 0-4)
    - cron: '0 22 * * 0-4'
  push:
    # 💡 중요: 봇이 파일을 푸시했을 때 이 워크플로우가 다시 실행되는 무한 루프를 원천 차단합니다.
    paths-ignore:
      - 'labview-pw.txt'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  update-password:
    runs-on: ubuntu-latest
    steps:
    # 1. 저장소 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 🌟 2. 한국 공휴일 자동 체크
    - name: Check if today is a Korean Holiday
      id: holiday-check
      shell: bash
      run: |
        python3 -c "
        import urllib.request
        import json
        import os
        from datetime import datetime, timedelta

        kst_now = datetime.utcnow() + timedelta(hours=9)
        today_str = kst_now.strftime('%Y-%m-%d')
        year = kst_now.strftime('%Y')

        is_holiday = 'false'
        try:
            url = f'https://date.nager.at/api/v3/PublicHolidays/{year}/KR'
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req) as response:
                holidays = json.loads(response.read().decode('utf-8'))
                holiday_dates = [h['date'] for h in holidays]
                
                if today_str in holiday_dates:
                    print(f'🚨 오늘은 한국 공휴일({today_str})입니다. 작업을 건너뜁니다.')
                    is_holiday = 'true'
                else:
                    print(f'✅ 오늘은 평일({today_str})이며 공휴일이 아닙니다.')
        except Exception as e:
            print(f'⚠️ 공휴일 API 조회 실패 (오류: {e}). 안전을 위해 진행합니다.')

        output_file = os.environ.get('GITHUB_OUTPUT')
        if output_file:
            with open(output_file, 'a') as f:
                f.write(f'is_holiday={is_holiday}\n')
        "

    # 3. Python을 사용하여 6~10자리 랜덤 문자열 생성 및 파일 쓰기
    - name: Generate Random Password
      if: steps.holiday-check.outputs.is_holiday == 'false'
      shell: bash
      run: |
        python3 -c "
        import random
        import string
        chars = string.ascii_letters + string.digits + '!@#$%^&*()'
        length = random.randint(6, 10)
        password = [
            random.choice(string.ascii_letters),
            random.choice(string.digits),
            random.choice('!@#$%^&*()')
        ]
        password += [random.choice(chars) for _ in range(length - 3)]
        random.shuffle(password)
        final_password = ''.join(password)
        with open('labview-pw.txt', 'w', encoding='utf-8') as f:
            f.write(final_password)
        "

    # 4. 변경된 파일을 GitHub에 커밋 및 푸시
    - name: Commit and Push changes
      if: steps.holiday-check.outputs.is_holiday == 'false'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --exit-code labview-pw.txt; then
          echo "No changes detected."
        else
          git add labview-pw.txt
          # 💡 수정: 후속 메일 발송 액션이 차단되지 않도록 [skip ci]를 완전히 제거했습니다.
          git commit -m "chore: update daily password"
          git push
        fi
