name: Auto Measure Shutdown Toggle

on:
  # schedule:
  #   # 💡 KST 월~금 아침 7시는 UTC 기준 일~목 밤 22시 (0 22 * * 0-4)
  #   - cron: '13 23 * * 0-4'
  # push:
  #   # 💡 중요: 봇이 파일을 푸시했을 때 이 워크플로우가 다시 실행되는 무한 루프를 원천 차단합니다.
  #   paths-ignore:
  #     - 'labview-AM-down.txt'
  workflow_dispatch: # 수동 실행 버튼
    # inputs:
    #   gist_id:
    #     description: "Gist ID"
    #     required: false
    #     default: "83a4f966a97c7005c8eac62882c70c91"
    #   filename:
    #     description: "Gist 안의 파일명"
    #     required: false
    #     default: "labview-AM-down.txt"
    #   max_delay_to_shutdown:
    #     description: "SHUTDOWNFALSE -> SHUTDOWN 될 때 랜덤 딜레이 최대값 (분)"
    #     required: false
    #     default: "10"
    #   max_delay_to_shutdownfalse:
    #     description: "SHUTDOWN -> SHUTDOWNFALSE 될 때 랜덤 딜레이 최대값 (분)"
    #     required: false
    #     default: "5"
  # schedule:
  #   - cron: "0 * * * *"   # 매 시 정각 (UTC 기준, KST -9h)

jobs:
  toggle:
    runs-on: ubuntu-latest
    ## !! concurrency.group을 gist_id+filename 조합으로 만들어서, 같은 gist/파일을 건드리는 실행들끼리만 순서를 관리합니다 (다른 gist를 대상으로 하는 실행과는 서로 안 막음)
    ## !! cancel-in-progress: false → 진행 중인 실행(딜레이 중이든 뭐든)을 취소하지 않고, 새 실행은 큐에서 대기했다가 이전 실행이 완전히 끝난 뒤 시작
    ## !! 만약 cancel-in-progress: true로 설정하면 반대로 새 실행이 들어올 때 이전 실행을 강제로 죽이는 방식인데, 이 경우엔 대기 중이던 딜레이가 통째로 날아가버리니 지금 상황엔 안 맞습니다. false(큐잉)가 맞는 선택이에요.

    # 이전 실행이 딜레이(sleep) 중이거나 진행 중일 때 새 실행이 들어오면
    # 동시에 돌지 않고 큐에서 대기했다가 순서대로 실행됨 (race condition 방지)
    concurrency:
      group: toggle-am-down-${{ 'labview-AM-down.txt' }} # 현재 workflows를 특정하는 임의 명칭
      cancel-in-progress: false
      
    steps:
      - name: Read current value from gist
        id: read
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}
          GIST_ID: ${{ secrets.LABVIEW_GIST_ID }}
          FILENAME: ${{ 'labview-AM-down.txt' }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
 
          token = os.environ["GITHUB_TOKEN"]
          gist_id = os.environ["GIST_ID"]
          filename = os.environ["FILENAME"]
 
          TOGGLE_MAP = {
              "SHUTDOWNFALSE": "SHUTDOWN",
              "SHUTDOWN": "SHUTDOWNFALSE",
          }
 
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toggle-am-down-workflow",
          }
 
          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}", headers=headers, method="GET"
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"::error::HTTP {e.code}: {e.read().decode('utf-8', errors='replace')}")
              sys.exit(1)
 
          files = data.get("files", {})
          if filename not in files:
              print(f"::error::'{filename}' 파일을 gist에서 찾을 수 없습니다. 사용 가능: {list(files.keys())}")
              sys.exit(1)
 
          current = files[filename]["content"].strip()
          print(f"현재 값: {current}")
 
          if current not in TOGGLE_MAP:
              print(f"::error::예상하지 못한 값 '{current}' (SHUTDOWN/SHUTDOWNFALSE 아님)")
              sys.exit(1)
 
          new_value = TOGGLE_MAP[current]
          print(f"새 값: {new_value}")
 
          # 다음 스텝들이 쓸 수 있도록 출력값으로 전달
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"current={current}\n")
              f.write(f"new_value={new_value}\n")
          EOF
 
      # - name: Random delay (minutes, direction-aware)
      - name: Random delay (seconds, direction-aware)
        env:
          NEW_VALUE: ${{ steps.read.outputs.new_value }}
          # MAX_DELAY_TO_SHUTDOWN: ${{ github.event.inputs.max_delay_to_shutdown || '10' }}
          # MAX_DELAY_TO_SHUTDOWNFALSE: ${{ github.event.inputs.max_delay_to_shutdownfalse || '5' }}
          MAX_DELAY_TO_SHUTDOWN: ${{ '500' }} # minute > second
          MAX_DELAY_TO_SHUTDOWNFALSE: ${{ '180' }}
        run: |
          # 토글 방향(new_value)에 따라 서로 다른 딜레이 범위 사용
          if [ "$NEW_VALUE" = "SHUTDOWN" ]; then
            MAX_DELAY_MINUTES="$MAX_DELAY_TO_SHUTDOWN"
            # echo "방향: SHUTDOWNFALSE -> SHUTDOWN (최대 ${MAX_DELAY_MINUTES}분 딜레이)"
            echo "방향: SHUTDOWNFALSE -> SHUTDOWN (최대 ${MAX_DELAY_MINUTES}초 딜레이)"
          else
            MAX_DELAY_MINUTES="$MAX_DELAY_TO_SHUTDOWNFALSE"
            # echo "방향: SHUTDOWN -> SHUTDOWNFALSE (최대 ${MAX_DELAY_MINUTES}분 딜레이)"
            echo "방향: SHUTDOWN -> SHUTDOWNFALSE (최대 ${MAX_DELAY_MINUTES}초 딜레이)"
          fi
 
          if [ "$MAX_DELAY_MINUTES" -le 0 ] 2>/dev/null; then
            echo "딜레이 없음 (max_delay_minutes=0)"
            exit 0
          fi
 
          # DELAY_MIN=$(( RANDOM % (MAX_DELAY_MINUTES + 1) ))
          # DELAY_SEC=$(( DELAY_MIN * 60 ))
          DELAY_SEC=$(( RANDOM % (MAX_DELAY_MINUTES + 1) ))
          # echo "랜덤 딜레이: ${DELAY_MIN}분 (${DELAY_SEC}초) 대기 중..."
          echo "랜덤 딜레이: ${DELAY_SEC}초 대기 중..."
          sleep "$DELAY_SEC"
          echo "대기 완료"
 
      - name: Update gist with new value
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}
          GIST_ID: ${{ secrets.LABVIEW_GIST_ID }}
          FILENAME: ${{ 'labview-AM-down.txt' }}
          NEW_VALUE: ${{ steps.read.outputs.new_value }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
 
          token = os.environ["GITHUB_TOKEN"]
          gist_id = os.environ["GIST_ID"]
          filename = os.environ["FILENAME"]
          new_value = os.environ["NEW_VALUE"]
 
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "toggle-am-down-workflow",
          }
 
          body = json.dumps({"files": {filename: {"content": new_value}}}).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=body,
              headers={**headers, "Content-Type": "application/json"},
              method="PATCH",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  resp.read()
          except urllib.error.HTTPError as e:
              print(f"::error::HTTP {e.code}: {e.read().decode('utf-8', errors='replace')}")
              sys.exit(1)
 
          print(f"완료: {filename} -> {new_value}")
          EOF
 
