name: Generate and Update Daily Password

on:
  schedule:
    # KST 월~금 아침 7시 (UTC 일~목 밤 22시)
    - cron: '17 23 * * 0-4'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  update-password:
    runs-on: ubuntu-latest
    steps:
    # 1. 한국 공휴일 자동 체크 (체크아웃 없이도 파ython 기본 라이브러리로 작동 가능)
    - name: Check if today is a Korean Holiday
      id: holiday-check
      shell: bash
      run: |
        python3 -c "
        import urllib.request
        import json
        import os
        from datetime import datetime, timedelta

        kst_now = datetime.utcnow() + timedelta(hours=9)
        today_str = kst_now.strftime('%Y-%m-%d')
        year = kst_now.strftime('%Y')

        is_holiday = 'false'
        try:
            url = f'https://date.nager.at/api/v3/PublicHolidays/{year}/KR'
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req) as response:
                holidays = json.loads(response.read().decode('utf-8'))
                holiday_dates = [h['date'] for h in holidays]
                if today_str in holiday_dates:
                    is_holiday = 'true'
        except Exception as e:
            print(f'⚠️ 공휴일 API 오류: {e}')

        output_file = os.environ.get('GITHUB_OUTPUT')
        if output_file:
            with open(output_file, 'a') as f:
                f.write(f'is_holiday={is_holiday}\n')
        "

    # 2. Python을 사용하여 랜덤 비밀번호 생성 및 Gist에 바로 업데이트
    - name: Generate Password and Update GitHub Gist
      if: steps.holiday-check.outputs.is_holiday == 'false'
      env:
        # GitHub Actions 환경 변수로 비밀 값들 세팅
        GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}
        GIST_ID: ${{ secrets.GIST_ID }}
      shell: bash
      run: |
        python3 -c "
        import random
        import string
        import urllib.request
        import json
        import os

        # 🔑 1. 랜덤 비밀번호 생성 로직
        chars = string.ascii_letters + string.digits + '!@#$%^&*()'
        length = random.randint(6, 10)
        password = [
            random.choice(string.ascii_letters),
            random.choice(string.digits),
            random.choice('!@#$%^&*()')
        ]
        password += [random.choice(chars) for _ in range(length - 3)]
        random.shuffle(password)
        final_password = ''.join(password)

        # 🌐 2. GitHub API를 통해 Gist 패치(업데이트) 요청
        gist_id = os.environ['GIST_ID']
        token = os.environ['GH_TOKEN']
        
        url = f'https://api.github.com/gists/{gist_id}'
        headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github+json'
        }
        
        # Gist 내부의 'labview-pw.txt' 파일 내용 수정 데이터 구성
        data = {
            'files': {
                'labview-pw.txt': {
                    'content': final_password
                }
            }
        }
        
        req = urllib.request.Request(url, data=json.dumps(data).encode('utf-8'), headers=headers, method='PATCH')
        try:
            with urllib.request.urlopen(req) as response:
                if response.status == 200:
                    print('🎉 Gist 비밀번호가 성공적으로 업데이트되었습니다!')
                    print(f'생성된 비밀번호: {final_password}')
        except Exception as e:
            print(f'🚨 Gist 업데이트 실패: {e}')
            exit(1)
        "
