name: Send Password Email via Gmail

on:
  push:
    paths:
      - 'labview-pw.txt' # labview-pw.txt 파일이 변경되어 푸시될 때만 자동으로 실행됩니다.
  workflow_dispatch: # 메일 발송만 따로 테스트하고 싶을 때 수동 실행 가능

jobs:
  read-and-send:
    runs-on: ubuntu-latest
    steps:
    # 1. 최신 파일 정보를 읽기 위해 저장소 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 파일에서 기존 비밀번호 정보를 읽어와 환경 변수로 캡처
    - name: Read Password from File
      id: read_pw
      run: |
        if [ -f labview-pw.txt ]; then
          PW_CONTENT=$(cat labview-pw.txt | tr -d '\n' | tr -d '\r')
          echo "LABVIEW_PW=$PW_CONTENT" >> $GITHUB_ENV
          echo "Successfully read password from file."
        else
          echo "Error: labview-pw.txt file not found!"
          exit 1
        fi

    # 3. 구글 지메일 SMTP를 통해 이메일 발송
    - name: Send Email via Gmail
      uses: dawidd6/action-send-mail@v3
      with:
        # 구글 지메일 표준 SMTP 설정
        server_address: smtp.gmail.com
        server_port: 465
        
        # GitHub Variables 및 Secrets 데이터 호출
        username: ${{ vars.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
                
        # 메일 본문 및 수신처 설정
        subject: "[알림] LabVIEW 자동 생성 비밀번호 안내"
        to: "gdchoi@etri.re.kr"
        bcc:: ${{ vars.RECEIVER_EMAILS }}
        from: "=[LabVIEW 자동화 시스템]= <${{ vars.EMAIL_USERNAME }}>"
        body: |
          안녕하세요.
          
          Labview 시스템 비밀번호 자동 갱신에 따른 메일 안내입니다.
          
          ----------------------------------------
          새로운 비밀번호: ${{ env.LABVIEW_PW }}
          ----------------------------------------
          
          본 메일은 시스템에 의해 자동으로 발송되었습니다.
