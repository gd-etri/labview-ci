name: Backup Gist Logs to Repository

on:
  repository_dispatch:
    types: [labview-backup-logs-trigger]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-gist-logs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}

      - name: Backup Gist Logs and Reset Gist Files
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}
          GIST_ID: ${{ secrets.LABVIEW_GIST_ID }}
        run: |
          python3 - <<'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          token = os.environ["GITHUB_TOKEN"]
          gist_id = os.environ["GIST_ID"]

          # 소문자 기준으로 매핑 (실제 Gist 파일명이 대문자 AA/AM 이어도 자동 매칭)
          target_mapping = {
              "labview-aa-end-log.txt": "LOGS-AA-END",
              "labview-aa-log.txt": "LOGS-AA",
              "labview-am-end-log.txt": "LOGS-AM-END",
              "labview-am-log.txt": "LOGS-AM",
              "labview-login-log.txt": "LOGS-LOGIN",
              "labview-login-try-log.txt": "LOGS-TRY-LOGIN",
          }

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "backup-gist-logs-workflow",
          }

          gist_url = f"https://api.github.com/gists/{gist_id}"
          req = urllib.request.Request(gist_url, headers=headers, method="GET")
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"::error::HTTP {e.code}: {e.read().decode('utf-8', errors='replace')}")
              sys.exit(1)

          files = data.get("files", {})
          # 실제 Gist 파일명 매핑 {소문자_파일명: 실제_파일명}
          actual_filenames = {k.lower(): k for k in files.keys()}

          kst_now = datetime.now(timezone.utc) + timedelta(hours=9)
          today_str = kst_now.strftime("%Y%m%d")
          print(f"📅 기준 날짜(KST): {today_str}")

          gist_update_payload = {"files": {}}

          for lower_name, target_dir in target_mapping.items():
              if lower_name not in actual_filenames:
                  print(f"⚠️ [SKIP] '{lower_name}'에 해당하는 파일을 Gist에서 찾을 수 없습니다.")
                  continue

              real_filename = actual_filenames[lower_name]
              content = files[real_filename].get("content", "")
              lines = content.splitlines()

              if len(lines) <= 1:
                  print(f"ℹ️ [SKIP] {real_filename}: 백업할 2번째 줄 이후 내용이 없습니다.")
                  continue

              first_line = lines[0]
              
              # 변경 전 (2번째 줄의 빈 줄까지 포함해서 백업)
              # backup_lines = lines[1:]

              # 변경 후 (2번째 줄 이후 중 내용이 있는 줄만 골라서 백업)
              backup_lines = [line for line in lines[1:] if line.strip()]
              

              if not any(line.strip() for line in backup_lines):
                  print(f"ℹ️ [SKIP] {real_filename}: 2번째 줄 이후 빈 줄만 존재합니다.")
                  continue

              os.makedirs(target_dir, exist_ok=True)
              backup_filepath = os.path.join(target_dir, f"{today_str}.txt")

              mode = "a" if os.path.exists(backup_filepath) else "w"
              with open(backup_filepath, mode, encoding="utf-8") as f:
                  if mode == "a":
                      f.write("\n")
                  f.write("\n".join(backup_lines) + "\n")

              print(f"✅ [BACKUP] {real_filename} -> {backup_filepath} ({len(backup_lines)}줄 저장)")

              # 실제 원본 파일명 그대로 업데이트: 1번째 줄 유지 + 2번째 줄 빈칸
              gist_update_payload["files"][real_filename] = {
                  "content": f"{first_line}\n"
              }

          if gist_update_payload["files"]:
              body = json.dumps(gist_update_payload).encode("utf-8")
              patch_req = urllib.request.Request(
                  gist_url,
                  data=body,
                  headers={**headers, "Content-Type": "application/json"},
                  method="PATCH",
              )
              try:
                  with urllib.request.urlopen(patch_req) as resp:
                      resp.read()
                  print("🎉 원본 Gist 파일 정리 완료 (1번째 줄 유지, 2번째 줄 빈칸)")
              except urllib.error.HTTPError as e:
                  print(f"::error::HTTP {e.code}: {e.read().decode('utf-8', errors='replace')}")
                  sys.exit(1)
          else:
              print("ℹ️ 백업하거나 초기화할 새로운 로그가 없습니다.")
          EOF

      - name: Commit and Push directly to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LOGS-*
          if git diff --staged --quiet; then
            echo "변경된 파일이 없어 커밋하지 않습니다."
          else
            TZ='Asia/Seoul' TODAY=$(date +'%Y%m%d')
            git commit -m "Backup Gist logs ($TODAY)"
            git push origin main
            echo "🚀 main 브랜치에 푸시 완료!"
          fi
