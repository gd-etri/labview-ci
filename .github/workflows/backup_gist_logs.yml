name: Backup Gist Logs to Repository

on:
  # 외부 cron-job 서비스에서 호출 시 사용할 트리거
  repository_dispatch:
    types: [labview-backup-logs-trigger]
  # GitHub Actions 탭에서 수동 실행 버튼
  workflow_dispatch:

permissions:
  contents: write  # main 브랜치에 직접 커밋 및 푸시하기 위한 권한

jobs:
  backup-gist-logs:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}

      - name: Check Message from Trigger
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "전달된 메시지: ${{ github.event.client_payload.message }}"

      - name: Backup Gist Logs and Reset Gist Files
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}
          GIST_ID: ${{ secrets.LABVIEW_GIST_ID }}
        shell: bash
        run: |
          python3 -c "
          import os
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          gist_id = os.environ['GIST_ID']
          token = os.environ['GH_TOKEN']

          file_mapping = {
              'labview-aa-end-log.txt': 'LOGS-AA-END',
              'labview-aa-log.txt': 'LOGS-AA',
              'labview-am-end-log.txt': 'LOGS-AM-END',
              'labview-am-log.txt': 'LOGS-AM',
              'labview-login-log.txt': 'LOGS-LOGIN',
              'labview-login-try-log.txt': 'LOGS-TRY-LOGIN',
          }

          def github_api(url, method='GET', data=None):
              headers = {
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'labview-ci-log-backup'
              }
              body = json.dumps(data).encode('utf-8') if data is not None else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode('utf-8'))

          # 한국 시간(KST, UTC+9) 기준 파일명 (예: 20261119)
          kst_now = datetime.now(timezone.utc) + timedelta(hours=9)
          today_str = kst_now.strftime('%Y%m%d')

          gist_url = f'https://api.github.com/gists/{gist_id}'
          gist_data = github_api(gist_url)
          files = gist_data.get('files', {})

          gist_update_payload = {'files': {}}

          for gist_filename, target_dir in file_mapping.items():
              if gist_filename not in files:
                  print(f'⚠️ [SKIP] {gist_filename} 파일이 Gist에 없습니다.')
                  continue

              content = files[gist_filename].get('content', '')
              lines = content.splitlines()

              # 첫 줄만 있거나 내용이 없는 경우 스킵
              if len(lines) <= 1:
                  print(f'ℹ️ [SKIP] {gist_filename}: 백업할 2번째 줄 이후 내용이 없습니다.')
                  continue

              first_line = lines[0]
              backup_lines = lines[1:]

              # 2번째 줄부터 마지막 줄까지 실질적인 로그 내용이 있는지 확인 (공백 줄만 있는 경우 제외)
              if not any(line.strip() for line in backup_lines):
                  print(f'ℹ️ [SKIP] {gist_filename}: 2번째 줄 이후 빈 줄만 존재합니다.')
                  continue

              # 해당 폴더에 백업 파일 생성 (예: LOGS-AA/20261119.txt)
              os.makedirs(target_dir, exist_ok=True)
              backup_filepath = os.path.join(target_dir, f'{today_str}.txt')

              # 같은 날짜에 이미 백업된 파일이 있으면 이어쓰기(append), 없으면 새로 생성(write)
              mode = 'a' if os.path.exists(backup_filepath) else 'w'
              with open(backup_filepath, mode, encoding='utf-8') as f:
                  if mode == 'a':
                      f.write('\n')
                  f.write('\n'.join(backup_lines) + '\n')

              print(f'✅ [BACKUP] {gist_filename} -> {backup_filepath} ({len(backup_lines)}줄 저장)')

              # 원본 Gist 파일 초기화 데이터 구성: 1번째 줄 유지 + 2번째 줄 빈칸
              gist_update_payload['files'][gist_filename] = {
                  'content': f'{first_line}\n'
              }

          # 백업된 로그가 하나라도 있으면 원본 Gist 일괄 업데이트
          if gist_update_payload['files']:
              try:
                  github_api(gist_url, method='PATCH', data=gist_update_payload)
                  print('🎉 원본 Gist 파일 정리 완료 (1번째 줄 유지, 2번째 줄 빈칸 처리)')
              except Exception as e:
                  print(f'🚨 Gist 업데이트 실패: {e}')
                  exit(1)
          else:
              print('ℹ️ 백업하거나 초기화할 새로운 로그가 없습니다.')
          "

      - name: Commit and Push directly to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LOGS-*
          if git diff --staged --quiet; then
            echo "변경된 로그 파일이 없어 커밋을 건너뜁니다."
          else
            TZ='Asia/Seoul' TODAY=$(date +'%Y%m%d')
            git commit -m "Backup Gist logs ($TODAY)"
            git push origin main
            echo "🚀 main 브랜치에 백업 파일 커밋 및 푸시 완료!"
          fi
