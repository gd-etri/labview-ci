name: Auto Measure END Trigger

on:
  # repository_dispatch:
  #   types: [labview-end-trigger]
  workflow_dispatch: # 수동 실행 버튼

jobs:
  validate-and-update:
    runs-on: ubuntu-latest
    steps:
      # - name: Checkout repository
      #   uses: actions/checkout@v4

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.x'

      - name: Execute Validation & Gist Update Script
        env:
          GIST_PAT: ${{ secrets.ACTIONS_PUSH_TOKEN_GD }}
          # 사용하는 Gist ID를 아래에 입력하세요. (파일들이 다른 Gist에 있다면 각각 지정 가능)
          LOG_GIST_ID: ${{ secrets.LABVIEW_GIST_ID }}
          ID_MAP_GIST_ID: ${{ secrets.LABVIEW_GIST_ID }}
          DOWN_GIST_ID: ${{ secrets.LABVIEW_GIST_ID }}
        run: |
          python -c '
          import os
          import json
          import re
          import urllib.request

          pat = os.environ.get("GIST_PAT")
          log_gist_id = os.environ.get("LOG_GIST_ID")
          id_map_gist_id = os.environ.get("ID_MAP_GIST_ID")
          down_gist_id = os.environ.get("DOWN_GIST_ID")

          headers = {
              "Authorization": f"token {pat}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "GitHub-Actions"
          }

          def get_gist_content(gist_id, filename):
              url = f"https://api.github.com/gists/{gist_id}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  return data["files"][filename]["content"]

          def update_gist_content(gist_id, filename, content):
              url = f"https://api.github.com/gists/{gist_id}"
              payload = json.dumps({"files": {filename: {"content": content}}}).encode()
              req = urllib.request.Request(url, data=payload, headers=headers, method="PATCH")
              with urllib.request.urlopen(req) as response:
                  print(f"Successfully updated {filename} to {content}")

          # 1. Gist 파일 내용 읽기
          log_text = get_gist_content(log_gist_id, "labview-AM-end-log.txt")
          id_map_text = get_gist_content(id_map_gist_id, "labview-id-N.txt")

          # 2. 로그 파일에서 마지막 줄 파싱
          lines = [line.strip() for line in log_text.strip().split("\n") if line.strip()]
          if not lines:
              print("Log file is empty.")
              exit(0)

          last_line = lines[-1]
          parts = last_line.split(" ")
          
          target_id = parts[0]      # 예: hskim83
          target_path = parts[3]    # 예: D:\김홍승\2026\...

          print(f"Parsed ID: {target_id}")
          print(f"Parsed Path: {target_path}")

          # 3. ID 매핑 파일에서 이름(Name) 찾기
          # 포맷 예: gdchoi_etri@outlook.com,최규동<gdchoi@etri.re.kr>,김홍승<hskim83@etri.re.kr>
          matched_name = None
          entries = id_map_text.split(",")
          for entry in entries:
              # 이름<아이디@domain> 또는 이름<아이디> 형태 정규식 추출
              match = re.search(r"([^<]+)<([^@<]+)", entry.strip())
              if match:
                  name = match.group(1).strip()
                  user_id = match.group(2).strip()
                  if user_id == target_id:
                      matched_name = name
                      break

          print(f"Matched Name: {matched_name}")

          # 4. 경로 유효성 검사 (D:\이름 또는 D:\아이디 로 시작하는지 검사)
          prefix_name = f"D:\\{matched_name}" if matched_name else None
          prefix_id = f"D:\\{target_id}"

          isValid = False
          if prefix_name and target_path.startswith(prefix_name):
              isValid = True
          elif target_path.startswith(prefix_id):
              isValid = True

          # 5. 유효하지 않은 경주일 경우 labview-AM-down.txt 수정
          if not isValid:
              print(f"Path validation failed. Path does not start with {prefix_name} or {prefix_id}")
              update_gist_content(down_gist_id, "labview-AM-down.txt", "SHUTDOWN")
          else:
              print("Path validation passed.")
          '
